name: Blender Render

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VENV_PATH: ${{ github.workspace }}/pyvenv

jobs:
  render:
    runs-on:
      group: gpu-runners
      labels: render-runner
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: "recursive"

      - name: Validate NVIDIA GPU Setup
        shell: bash
        run: |
          nvidia-smi
          echo "NVIDIA Driver Version:"
          nvidia-smi --query-gpu=driver_version --format=csv,noheader
          echo "GPU Model:"
          nvidia-smi --query-gpu=gpu_name --format=csv,noheader

      - name: Setup NVIDIA OpenGL
        run: |
          # Install NVIDIA OpenGL libraries
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-nvidia-glx \
            nvidia-utils-550 \    # Match your driver version (550)
            libglvnd-dev

          # Set NVIDIA as the OpenGL provider
          export __GLX_VENDOR_LIBRARY_NAME=nvidia

          # Verify OpenGL is using NVIDIA
          echo "Testing OpenGL configuration:"
          glxinfo | grep "OpenGL vendor" || echo "OpenGL vendor not found"
          glxinfo | grep "OpenGL renderer" || echo "OpenGL renderer not found"

          # Add these environment variables to your shell
          echo "export __GLX_VENDOR_LIBRARY_NAME=nvidia" >> ~/.bashrc
          echo "export LIBGL_ALWAYS_SOFTWARE=0" >> ~/.bashrc

      - name: Install Blender 4.0.2
        run: |
          wget https://download.blender.org/release/Blender4.0/blender-4.0.2-linux-x64.tar.xz
          tar -xf blender-4.0.2-linux-x64.tar.xz
          sudo mv blender-4.0.2-linux-x64 /opt/blender
          sudo ln -s /opt/blender/blender /usr/local/bin/blender
          # Install required shared libraries
          sudo apt-get update
          sudo apt-get install -y libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libxrandr2

      - name: Verify Blender GPU Support
        run: |
          blender -b --python-expr "import bpy; import gpu; print('OpenGL Renderer:', gpu.platform.renderer_get()); print('OpenGL Vendor:', gpu.platform.vendor_get())"

      - name: Install Python Dependencies
        run: |
          /opt/blender/4.0/python/bin/python3.10 -m pip install --upgrade pip
          /opt/blender/4.0/python/bin/python3.10 -m pip install -r requirements.txt

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Run main script
        run: |
          chmod +x ./main.sh
          ./main.sh
          xvfb-run -a ./main.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: render-output
          path: output/output.mp4
