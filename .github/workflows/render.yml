name: Blender Render

on:
  workflow_dispatch:
    inputs:
      config:
        description: "JSON config (optional)"
        required: false
        type: string

permissions:
  contents: read

env:
  VENV_PATH: ${{ github.workspace }}/pyvenv

jobs:
  render:
    runs-on:
      group: gpu-runners
      labels: render-runner
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GH_PAT }}
          submodules: "recursive"

      - name: Setup Config
        if: inputs.config != ''
        run: |
          echo '${{ inputs.config }}' > config.json
          # Validate JSON format
          cat config.json | jq '.' || (echo "Invalid JSON config" && exit 1)

      - name: Check Config and Directory
        run: |
          if [ -f "config.json" ]; then
            echo "Using existing config.json"
          else
            echo "No config.json found, will use default settings"
          fi

      - name: Validate NVIDIA GPU Setup
        run: |
          nvidia-smi

      - name: Install Blender 4.0.2
        run: |
          wget https://download.blender.org/release/Blender4.0/blender-4.0.2-linux-x64.tar.xz
          tar -xf blender-4.0.2-linux-x64.tar.xz
          sudo mv blender-4.0.2-linux-x64 /opt/blender
          sudo ln -s /opt/blender/blender /usr/local/bin/blender
          # Install required shared libraries
          sudo apt-get update
          sudo apt-get install -y libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libxrandr2

      - name: Install Python Dependencies
        run: |
          /opt/blender/4.0/python/bin/python3.10 -m pip install --upgrade pip
          /opt/blender/4.0/python/bin/python3.10 -m pip install -r requirements.txt

      - name: Run main script
        run: |
          /opt/blender/4.0/python/bin/python3.10 main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: render-output
          path: output/output.mp4
