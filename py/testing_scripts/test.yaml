track: "BEL" # must be a 3 letter all capitals string
year: 2023 # must be a 4 digit integer
render:
  should_render: false
  validate_render: true # will only create a few frames
  fps: 30
  samples: 4096
  adaptive_sampling: true
  is_4k: true # options are just 4k or 1920 by 1080 which is false
  output: "output.mp4"

drivers:
  - name: "VER" # must be 3 letter identifier
    color: "red" # there will be a finite # of color options
  - name: "HAM"
    color: "blue"
