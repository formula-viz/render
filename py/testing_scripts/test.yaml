track: BEL # must be a 3 letter all capitals string
year: 2024 # must be a 4 digit integer
render:
  should_render: false # whether to render the video, applies to both render and post_render
  validate_render: false # will only create a few frames
  fps: 30
  samples: 32
  adaptive_sampling: true
  is_4k: true
  output: output.mp4
  max_cam_distance: 70
drivers:
- name: VER # must be 3 letter identifier
  pos: 1
  color: '#fcd700'
- name: LEC
  pos: 2
  color: '#dc0000'
